name: Backend Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-tests.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acolhesp_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d acolhesp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/demo/pom.xml

      - name: Initialize test database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U test -d acolhesp_test -v ON_ERROR_STOP=1 \
            < database/init.sql

      - name: Run tests
        working-directory: backend/demo
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/acolhesp_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_JPA_HIBERNATE_DDL_AUTO: none
        run: ./mvnw clean test