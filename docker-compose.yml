
services:
  # Banco de dados do BACKEND:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Importa os abrigos quando o banco estiver pronto.
  importar-abrigos:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./importar_abrigos.py:/app/importar_abrigos.py:ro
      - ./centro_acolhida_geocodificado.txt:/app/centro_acolhida_geocodificado.txt:ro
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - pip install --quiet --disable-pip-version-check psycopg2-binary && python importar_abrigos.py

volumes:
  postgres_data:
