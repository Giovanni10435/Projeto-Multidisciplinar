spring.datasource.url=jdbc:h2:mem:acolhesp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
# O driver e inferido pela URL: H2 local ou PostgreSQL fornecido pelo CI.
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# No CI, ddl-auto=none e o esquema original ja existe. Aplique tambem a
# migracao incremental. Localmente, o Hibernate cria o esquema antes dela.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/001_horarios_voluntariado.sql
spring.sql.init.encoding=UTF-8
